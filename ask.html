<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project - html JavaScript</title>
    <link rel="stylesheet" href="SCSS/style.css">
    <link rel="stylesheet" href="SCSS/ask.css">
    <link rel="stylesheet" href="SCSS/forms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body id="top">
    <header>
        <div class="nav-container">
            <div class="logo">Ask<span>Hub</span></div>
            <div class="subtitle">A place where you can find an answer to any question.</div>

            <!--צקבוקס מוסתר-->
            <input type="checkbox" id="menu-toggle">

            <!--כפתור לפתיחת התפריט-->
            <label for="menu-toggle" class="hamburger">
                ☰
            </label>

            <nav class="menu">
                <a href="index.html">Homepage</a>
                <a href="about.html">About</a>
                <a href="ask.html">Ask a question</a>
                <a id="login-link" href="login.html" class="login">Log In</a>
                <a id="signup-link" href="register.html" class="signup">Sign Up</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- טופס לשאילת שאלה (מוצג אך ורק למשתמש מחובר) -->
        <div class="white-bubble">
            <h2>Ask a question</h2>

            <div class="form-content">
                <form id="ask-question-form" class="form" novalidate>
                    <label>Question title:
                        <input id="question-title" type="text" name="title" required placeholder="type here...">
                        <div id="question-title-error" class="error"></div>
                    </label>

                    <label>Question content:
                        <textarea id="question-content" type="text" name="content" required placeholder="write you question here..." max=3000></textarea>
                        <div id="question-content-error" class="error"></div>
                    </label>

                    <button type="submit" class="ask-question-btn">Post question</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Success Modal - טופס צף שאומר למשתמש שהוא העלה את השאלה בהצלחה -->
    <div id="success-modal" class="modal">

        <div class="posting-modal-content">

            <h3>Your question has been posted successfully!</h3>

            <button id="close-success" type="button">Yay!</button>

        </div>
    </div>

    <footer id="form-section" class="copyright">
        <p>
            <span class="contact">
                Need help? Contact us: <i class="fa-brands fa-whatsapp"></i> 051-234-5678
            </span>

            <span class="separator">|</span>

            <span class="social">
                <i class="fa-brands fa-instagram"></i> askhub_il
            </span>

            <span>
                <i id="facebook" class="fa-brands fa-facebook"></i> Askhub Community
            </span>
        </p>
        <p>© AskHub 2026.</p>
    </footer>

    <script src="js/navbar.js"></script>
    <script src="js/ask.js"></script>
</body>

</html>
