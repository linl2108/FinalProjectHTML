<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project - html JavaScript</title>
    <link rel="stylesheet" href="SCSS/style.css">
    <link rel="stylesheet" href="SCSS/forms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body id="top">

    <header>
        <div class="nav-container">
            <div class="logo">Ask<span>Hub</span></div>
            <div class="subtitle">A place where you can find an answer to any question.</div>

            <!--צקבוקס מוסתר-->
            <input type="checkbox" id="menu-toggle">

            <!--כפתור לפתיחת התפריט-->
            <label for="menu-toggle" class="hamburger">
                ☰
            </label>

            <nav class="menu">
                <a href="index.html">Homepage</a>
                <a href="about.html">About</a>
                <a href="ask.html">Ask a question</a>
                <a id="login-link" href="login.html" class="login">Log In</a>
                <a id="signup-link" href="register.html" class="signup">Sign Up</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="site-title">Welcome back to AskHub!</h1>
        <div class="white-bubble">
            <h2>Log In</h2>
            <p>
            <div class="form-content">
                Not signed-up yet?
                <a href="register.html">Sign up</a>
                </p>
                <form id="login-form" class="form">
                    <label>Username:
                        <input id="login-username" type="text" name="username" required placeholder="type here..."">
                    </label>

                    <label>Password:
                    <div class=" password-container">
                        <input id="password" type="password" name="password" required placeholder="type here...">
                        <!-- עין פתוחה -->
                        <img id="eye-icon" class="toggle-password" src="images/eyeicon.png" alt="show password">
                    </div>
            <div id="login-error" class="error"></div>
            </label>
            <button type="submit" class="login-btn">Log In</button>
        </div>
        </form>
        </div>
    </main>

    <footer id="form-section" class="copyright">
        <p>
            <span class="contact">
                Need help? Contact us: <i class="fa-brands fa-whatsapp"></i> 051-234-5678
            </span>

            <span class="separator">|</span>

            <span class="social">
                <i class="fa-brands fa-instagram"></i> askhub_il
            </span>

            <span>
                <i id="facebook" class="fa-brands fa-facebook"></i> Askhub Community
            </span>
        </p>
        <p>© AskHub 2026.</p>
    </footer>

    <script src="js/navbar.js"></script>
    <script src="js/user.js"></script>
    <script src="js/password.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
